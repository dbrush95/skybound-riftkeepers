name: Decode binary assets

on:
  push:
    paths:
      - "docs/media-b64/**"
      - "releases/*.b64"
      - "releases/apk-chunks/**"
      - ".github/workflows/decode-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode base64 screenshots and APK
        run: |
          set -euo pipefail
          mkdir -p docs/media releases
          if [ -d docs/media-b64 ]; then
            for f in docs/media-b64/*.b64; do
              [ -f "$f" ] || continue
              name=$(basename "$f" .b64)
              tr -d '\n\r ' < "$f" | base64 -d > "docs/media/$name"
              echo "decoded docs/media/$name ($(wc -c < "docs/media/$name") bytes)"
            done
          fi
          if [ -d releases/apk-chunks ]; then
            cat $(ls releases/apk-chunks/*.b64 | sort) | tr -d '\n\r ' | base64 -d > releases/Skybound-Riftkeepers.apk
            echo "decoded APK from chunks ($(wc -c < releases/Skybound-Riftkeepers.apk) bytes)"
          elif ls releases/*.b64 >/dev/null 2>&1; then
            for f in releases/*.b64; do
              [ -f "$f" ] || continue
              name=$(basename "$f" .b64)
              tr -d '\n\r ' < "$f" | base64 -d > "releases/$name"
              echo "decoded releases/$name"
            done
          fi
      - name: Commit decoded binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media
          if ls releases/*.apk >/dev/null 2>&1; then
            git add releases/*.apk
          fi
          if git diff --cached --quiet; then
            echo "no binary changes"
          else
            git commit -m "Add decoded screenshots and Android APK"
            git push
          fi
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        if: hashFiles('releases/Skybound-Riftkeepers.apk') != ''
        with:
          tag_name: v1.0.0
          name: Skybound Riftkeeper v1.0.0
          body: |
            Sideload **Skybound-Riftkeepers.apk** (landscape, package `com.skybound.riftkeepers`).

            Enable *Install unknown apps* for your browser or file manager, then open the APK.

            Windows portable pack is over GitHub's 100 MB file cap — use the zip from the project chat.
          files: releases/Skybound-Riftkeepers.apk
          make_latest: true
